<div id="ag-instructor-wireframe" aria-label="Autograde 교수자 운영 화면 설계">
  <style>
    #ag-instructor-wireframe { --ag-bg:light-dark(#f5f7fa,#15191f); --ag-panel:light-dark(#ffffff,#1e242d); --ag-text:light-dark(#172333,#eef2f8); --ag-muted:light-dark(#526176,#b3bfce); --ag-line:light-dark(#d5dde7,#485465); --ag-accent:light-dark(#2456a6,#9ec2ff); --ag-onaccent:light-dark(#ffffff,#10213d); --ag-soft:light-dark(#eaf1fc,#27394f); --ag-warn:light-dark(#7d4900,#ffce8c); --ag-warnbg:light-dark(#fff5e3,#362b1d); --ag-good:light-dark(#176146,#8bddb6); --ag-goodbg:light-dark(#edf8f2,#21382f); --ag-error:light-dark(#a12030,#ffb2bd); --ag-space:20px; background:var(--ag-bg); color:var(--ag-text); font:14px/1.6 system-ui,sans-serif; overflow-wrap:anywhere; width:100%; }
    #ag-instructor-wireframe * { box-sizing:border-box; }
    #ag-instructor-wireframe [hidden] { display:none!important; }
    #ag-instructor-wireframe button, #ag-instructor-wireframe input, #ag-instructor-wireframe select, #ag-instructor-wireframe textarea { font:inherit; color:inherit; max-width:100%; }
    #ag-instructor-wireframe button { min-height:40px; border:1px solid var(--ag-line); border-radius:7px; background:var(--ag-panel); padding:8px 12px; text-align:center; white-space:normal; }
    #ag-instructor-wireframe button:hover:not(:disabled) { background:var(--ag-soft); }
    #ag-instructor-wireframe button:disabled { color:var(--ag-muted); background:var(--ag-bg); cursor:not-allowed; }
    #ag-instructor-wireframe :focus-visible { outline:3px solid var(--ag-accent); outline-offset:3px; }
    #ag-instructor-wireframe button.ag-primary { background:var(--ag-accent); color:var(--ag-onaccent); border-color:var(--ag-accent); }
    #ag-instructor-wireframe button.ag-link { border-color:transparent; background:transparent; color:var(--ag-accent); text-align:left; padding:4px 0; }
    #ag-instructor-wireframe h2 { font-size:24px; line-height:1.35; margin:0 0 8px; font-weight:600; }
    #ag-instructor-wireframe h3 { font-size:17px; line-height:1.5; margin:0 0 10px; font-weight:600; }
    #ag-instructor-wireframe p { margin:4px 0 12px; }
    #ag-instructor-wireframe small, #ag-instructor-wireframe .ag-meta { font-size:12px; color:var(--ag-muted); }
    #ag-instructor-wireframe .ag-demo { padding:8px 20px; background:var(--ag-warnbg); color:var(--ag-warn); }
    #ag-instructor-wireframe .ag-top { padding:16px 20px; background:var(--ag-panel); border-bottom:1px solid var(--ag-line); display:flex; flex-wrap:wrap; gap:14px 24px; align-items:center; justify-content:space-between; }
    #ag-instructor-wireframe .ag-brand { font-size:18px; font-weight:600; }
    #ag-instructor-wireframe .ag-context { display:grid; gap:4px; min-width:0; max-width:100%; }
    #ag-instructor-wireframe select, #ag-instructor-wireframe input, #ag-instructor-wireframe textarea { background:var(--ag-panel); border:1px solid var(--ag-line); border-radius:6px; padding:9px 10px; width:100%; min-width:0; }
    #ag-instructor-wireframe .ag-shell { display:grid; grid-template-columns:154px minmax(0,1fr); }
    #ag-instructor-wireframe .ag-nav { padding:18px 12px; background:var(--ag-panel); border-right:1px solid var(--ag-line); display:flex; flex-direction:column; gap:6px; }
    #ag-instructor-wireframe .ag-nav button { border-color:transparent; text-align:left; }
    #ag-instructor-wireframe .ag-nav button[aria-current="page"] { background:var(--ag-soft); color:var(--ag-accent); font-weight:600; }
    #ag-instructor-wireframe .ag-main { padding:var(--ag-space); min-width:0; }
    #ag-instructor-wireframe .ag-heading, #ag-instructor-wireframe .ag-row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    #ag-instructor-wireframe .ag-heading { margin-bottom:18px; align-items:flex-start; }
    #ag-instructor-wireframe .ag-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    #ag-instructor-wireframe .ag-panel { padding:var(--ag-space); border:1px solid var(--ag-line); border-radius:10px; background:var(--ag-panel); margin-bottom:16px; min-width:0; }
    #ag-instructor-wireframe .ag-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:16px 0; }
    #ag-instructor-wireframe .ag-stat { padding:16px; background:var(--ag-panel); border:1px solid var(--ag-line); border-radius:10px; }
    #ag-instructor-wireframe .ag-value { font-size:26px; font-weight:600; display:block; font-variant-numeric:tabular-nums; }
    #ag-instructor-wireframe .ag-badge { display:inline-block; padding:3px 8px; border-radius:5px; background:var(--ag-soft); color:var(--ag-accent); font-size:12px; }
    #ag-instructor-wireframe .ag-badge.good { color:var(--ag-good); background:var(--ag-goodbg); }
    #ag-instructor-wireframe .ag-badge.warn { color:var(--ag-warn); background:var(--ag-warnbg); }
    #ag-instructor-wireframe .ag-notice { padding:12px 14px; background:var(--ag-soft); border-radius:7px; margin:12px 0; }
    #ag-instructor-wireframe .ag-warning { background:var(--ag-warnbg); color:var(--ag-warn); }
    #ag-instructor-wireframe .ag-filters, #ag-instructor-wireframe .ag-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:12px 0 18px; }
    #ag-instructor-wireframe label { display:grid; gap:6px; }
    #ag-instructor-wireframe table { width:100%; border-collapse:collapse; background:var(--ag-panel); }
    #ag-instructor-wireframe th { color:var(--ag-muted); font-weight:500; text-align:left; }
    #ag-instructor-wireframe th, #ag-instructor-wireframe td { padding:12px 10px; border-bottom:1px solid var(--ag-line); vertical-align:top; }
    #ag-instructor-wireframe td:first-child { min-width:125px; }
    #ag-instructor-wireframe .ag-table-panel { background:var(--ag-panel); border:1px solid var(--ag-line); border-radius:10px; padding:0 8px; }
    #ag-instructor-wireframe .ag-steps { list-style:none; padding:0; margin:0 0 18px; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    #ag-instructor-wireframe .ag-steps li { padding:8px; border-bottom:2px solid var(--ag-line); color:var(--ag-muted); }
    #ag-instructor-wireframe .ag-steps li[aria-current="step"] { border-color:var(--ag-accent); color:var(--ag-accent); font-weight:600; }
    #ag-instructor-wireframe details { border-top:1px solid var(--ag-line); padding-top:12px; margin-top:12px; }
    #ag-instructor-wireframe summary { color:var(--ag-accent); min-height:32px; }
    #ag-instructor-wireframe dl { display:grid; grid-template-columns:minmax(80px,1fr) 3fr; gap:8px 16px; margin:12px 0; }
    #ag-instructor-wireframe dt { color:var(--ag-muted); }
    #ag-instructor-wireframe dd { margin:0; }
    #ag-instructor-wireframe .ag-error { color:var(--ag-error); }
    #ag-instructor-wireframe .ag-code { padding:12px; background:var(--ag-bg); border:1px solid var(--ag-line); border-radius:6px; font:13px/1.7 ui-monospace,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
    #ag-instructor-wireframe .ag-added { color:var(--ag-good); }
    #ag-instructor-wireframe .ag-removed { color:var(--ag-error); }
    #ag-instructor-wireframe .ag-foot { border-top:1px solid var(--ag-line); padding:12px 20px; background:var(--ag-panel); color:var(--ag-muted); font-size:12px; }
    #ag-instructor-wireframe .ag-toast:empty { display:none; }
    #ag-instructor-wireframe .ag-toast { background:var(--ag-soft); border-radius:6px; padding:10px 12px; margin-bottom:12px; }
    #ag-instructor-wireframe[data-cards="true"] .ag-responsive thead { display:none; }
    #ag-instructor-wireframe[data-cards="true"] .ag-responsive tbody, #ag-instructor-wireframe[data-cards="true"] .ag-responsive tr { display:block; }
    #ag-instructor-wireframe[data-cards="true"] .ag-responsive tr { padding:8px 0; border-bottom:1px solid var(--ag-line); }
    #ag-instructor-wireframe[data-cards="true"] .ag-responsive td { display:grid; grid-template-columns:92px minmax(0,1fr); gap:12px; border:0; padding:6px 10px; }
    #ag-instructor-wireframe[data-cards="true"] .ag-responsive td::before { content:attr(data-label); color:var(--ag-muted); }
    @media(max-width:700px) {
      #ag-instructor-wireframe .ag-shell { grid-template-columns:1fr; }
      #ag-instructor-wireframe .ag-nav { border-right:0; border-bottom:1px solid var(--ag-line); flex-direction:row; flex-wrap:wrap; gap:4px; padding:10px; }
      #ag-instructor-wireframe .ag-main { padding:14px; }
      #ag-instructor-wireframe .ag-nav button { flex:1 1 auto; text-align:center; }
      #ag-instructor-wireframe .ag-responsive thead { display:none; }
      #ag-instructor-wireframe .ag-responsive tbody, #ag-instructor-wireframe .ag-responsive tr { display:block; }
      #ag-instructor-wireframe .ag-responsive tr { padding:8px 0; border-bottom:1px solid var(--ag-line); }
      #ag-instructor-wireframe .ag-responsive td { display:grid; grid-template-columns:84px minmax(0,1fr); gap:10px; border:0; padding:6px 8px; }
      #ag-instructor-wireframe .ag-responsive td::before { content:attr(data-label); color:var(--ag-muted); }
    }
    @media(max-width:440px) {
      #ag-instructor-wireframe .ag-top { padding:14px; }
      #ag-instructor-wireframe .ag-context { width:100%; }
      #ag-instructor-wireframe .ag-stats, #ag-instructor-wireframe .ag-fields, #ag-instructor-wireframe .ag-filters { grid-template-columns:1fr; }
      #ag-instructor-wireframe .ag-stat { display:flex; align-items:center; justify-content:space-between; gap:8px; }
      #ag-instructor-wireframe .ag-stat .ag-value { font-size:22px; }
      #ag-instructor-wireframe .ag-steps { grid-template-columns:repeat(2,minmax(0,1fr)); }
      #ag-instructor-wireframe button { min-height:44px; }
      #ag-instructor-wireframe input, #ag-instructor-wireframe textarea, #ag-instructor-wireframe select { font-size:16px; }
    }
  </style>
  <div class="ag-demo">설계 미리보기 · 가상 데이터 · 서버 미연결</div>
  <header class="ag-top">
    <div><div class="ag-brand">Autograde <span class="ag-meta">교수자</span></div><div class="ag-meta">2026학년도 · 2학기</div></div>
    <label class="ag-context">관리할 교과목·분반
      <select id="ag-course" class="cursor-interaction">
        <option value="come2201-01">come2201 · 시스템 프로그래밍 · 01분반</option>
        <option value="come2201-02">come2201 · 시스템 프로그래밍 · 02분반</option>
        <option value="come3105-01">come3105 · 소프트웨어 설계 · 01분반</option>
      </select>
    </label>
  </header>
  <div class="ag-shell">
    <nav class="ag-nav" aria-label="교수자 메뉴">
      <button type="button" data-view="home" class="cursor-interaction" aria-current="page">수업 개요</button>
      <button type="button" data-view="assignments" class="cursor-interaction">과제</button>
      <button type="button" data-view="results" class="cursor-interaction">제출·결과</button>
      <button type="button" disabled>학생 · 후속 설계</button>
      <button type="button" disabled>설정 · 후속 설계</button>
    </nav>
    <main class="ag-main">
      <p id="ag-breadcrumb" class="ag-meta">시스템 프로그래밍 / 01분반 / 수업 개요</p>
      <div id="ag-toast" class="ag-toast" role="status" aria-live="polite"></div>
      <div id="ag-content"></div>
    </main>
  </div>
  <footer class="ag-foot">공유 교수자 계정 · 개인별 수업 권한 없음 · 보관·보고서 실행 기능은 후속 단계</footer>
</div>
<script>
(() => {
  const root = document.getElementById('ag-instructor-wireframe');
  const content = root.querySelector('#ag-content');
  const picker = root.querySelector('#ag-course');
  const state = { view:'home', course:'come2201-01', assignment:'observer', query:'', filter:'all', step:1, title:'데코레이터 패턴 — 주문 금액 계산', language:'C++17', due:'2026-09-25T18:00', uploaded:false, check:false, published:false, dirty:false, comparison:'2-1' };
  const design = { compact:false, cards:false };
  const courses = {
    'come2201-01':{name:'시스템 프로그래밍', section:'01', students:24},
    'come2201-02':{name:'시스템 프로그래밍', section:'02', students:21},
    'come3105-01':{name:'소프트웨어 설계', section:'01', students:23}
  };
  const tasks = [
    {id:'observer',title:'옵저버 패턴 — 센서 알림',language:'C++17',check:'검증 성공',status:'진행',origin:'웹 등록',due:'09.20 18:00',accepted:22,submitted:18},
    {id:'hello',title:'Hello World — 표준 입출력',language:'C11',check:'검증 성공',status:'마감',origin:'CLI 등록',due:'09.11 18:00',accepted:24,submitted:24},
    {id:'decorator',title:'데코레이터 패턴 — 주문 금액 계산',language:'C++17',check:'미검증',status:'초안',origin:'웹 등록',due:'09.25 18:00',accepted:null,submitted:null}
  ];
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const button = (text,attrs='',primary=false) => `<button type="button" class="cursor-interaction ${primary?'ag-primary':''}" ${attrs}>${text}</button>`;
  const badge = (text,kind='') => `<span class="ag-badge ${kind}">${text}</span>`;
  const heading = (title,desc,action='') => `<div class="ag-heading"><div><h2>${title}</h2><p class="ag-meta">${desc}</p></div>${action}</div>`;
  const table = (headers,rows) => `<div class="ag-table-panel"><table class="ag-responsive"><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((cell,i)=>`<td data-label="${headers[i]}">${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  const stat = (label,value,note='') => `<div class="ag-stat"><div>${label}${note?`<div class="ag-meta">${note}</div>`:''}</div><strong class="ag-value">${value}</strong></div>`;
  const notify = text => { root.querySelector('#ag-toast').textContent = text; };
  const selectedTask = () => tasks.find(t=>t.id===state.assignment) || tasks[0];
  function store() {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{screen:state.view,course:state.course},privateContent:{cards:design.cards,compact:design.compact}}).catch(()=>{});
  }
  function home() {
    if(state.course!=='come2201-01') return heading('수업 개요',`${courses[state.course].name} · ${courses[state.course].section}분반`) + `<section class="ag-panel"><h3>이 분반에 등록된 과제가 없습니다</h3><p>수강 학생 ${courses[state.course].students}명 · 다른 분반의 과제·학생 선택은 해제되었습니다.</p>${button('첫 과제 준비 화면 보기','data-action="new"',true)}</section>`;
    return heading('수업 개요','2026.09.18 15:22 KST 기준 · 예시 현황',button('과제 관리','data-view="assignments"',true)) +
      `<section class="ag-panel"><div class="ag-row"><div><span class="ag-meta">진행 중인 과제</span><h3>옵저버 패턴 — 센서 알림</h3></div>${badge('진행')}</div><p>마감 <strong>2026.09.20 18:00 KST</strong></p><div class="ag-stats">${stat('제출 학생','18 / 24','최신 접수본 기준')}${stat('채점 대기','2명','현재 점수 미확정')}${stat('아직 미접수','6명','마감 위반 판정 아님')}</div><div class="ag-actions">${button('제출 현황 확인','data-view="results"')}${button('과제 상세','data-task="observer"')}</div></section>` +
      `<section class="ag-panel"><h3>다음 할 일</h3><div class="ag-row"><div><strong>데코레이터 패턴 — 주문 금액 계산</strong><p class="ag-meta">초안 · 학생에게 공개되지 않음 · 자료 등록 필요</p></div>${button('이어서 준비','data-action="new"')}</div></section>`;
  }
  function filteredTasks() {return tasks.filter(t=>(!state.query || t.title.toLowerCase().includes(state.query.toLowerCase())) && (state.filter==='all'||t.status===state.filter));}
  function taskTable() {
    if(state.course!=='come2201-01') return '<section class="ag-panel">이 분반에는 과제가 없습니다. 새 과제를 등록해 주세요.</section>';
    const rows=filteredTasks().map(t=>[
      `<button class="ag-link cursor-interaction" type="button" data-task="${t.id}"><strong>${t.title}</strong></button><div class="ag-meta">${t.language} · ${t.origin}</div>`,
      `${badge(t.status,t.status==='초안'?'warn':'')}<div class="ag-meta">${t.check}</div>`,
      `${t.due}<div class="ag-meta">2026 · KST</div>`,
      t.accepted===null?'아직 비공개':`수락 ${t.accepted}명<br>제출 ${t.submitted}명`
    ]);
    return rows.length?table(['과제','공개·검증','마감','학생 현황'],rows):'<section class="ag-panel">조건에 맞는 과제가 없습니다. 검색어나 상태를 변경해 주세요.</section>';
  }
  function assignments() {
    return heading('과제','웹·CLI 과제를 한곳에서 관리합니다.',button('새 과제 등록','data-action="new"',true)) +
      `<div class="ag-filters"><label>과제 검색<input id="ag-search" type="search" placeholder="과제 이름" value="${esc(state.query)}"></label><label>공개 상태<select id="ag-filter"><option value="all">전체</option>${['진행','초안','마감'].map(s=>`<option ${state.filter===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div id="ag-task-list">${taskTable()}</div>`;
  }
  function detail() {
    const t=selectedTask();
    if(t.id==='decorator') return heading(t.title,'초안 · 아직 학생에게 보이지 않습니다.',button('이어서 준비','data-action="new"',true)) + '<section class="ag-panel"><h3>다음 단계: 학생용 파일</h3><p>자료를 등록한 뒤 정답·오답 검증을 통과해야 공개할 수 있습니다.</p></section>';
    return heading(t.title,`${t.language} · ${t.origin} · 공개본 v1`,t.id==='observer'?button('학생 제출 확인','data-view="results"',true):'') +
      `<section class="ag-panel"><div class="ag-actions">${badge(t.status)}${badge('검증 성공','good')}</div><dl><dt>학생 공개</dt><dd>${t.status==='마감'?'공개 완료 · 제출 마감':'공개 완료 · 수령·제출 가능'}</dd><dt>제출 마감</dt><dd>2026.${t.due} KST (UTC+09:00)</dd><dt>결과 공개</dt><dd>채점 완료 후 공개</dd><dt>학생 현황</dt><dd>수락 ${t.accepted}명 · 제출 ${t.submitted}명</dd></dl><div class="ag-notice">검증 통과와 공개 완료는 별개입니다. 이 과제는 이미 공개되어 있습니다.</div></section>` +
      `<section class="ag-panel"><h3>운영 작업</h3><p>공개된 문제·채점 자료는 직접 덮어쓰지 않습니다.</p><div class="ag-actions">${button('새 버전 초안 준비','data-action="copy"')}</div><details><summary class="cursor-interaction">마감 연장·숨김</summary><p class="ag-meta">마감 단축은 지원하지 않습니다. 수락·제출 이력이 있어 숨김은 불가합니다.</p><form id="ag-extend"><div class="ag-fields"><label>새 마감 · KST<input id="ag-new-due" type="datetime-local" required value="2026-09-22T18:00"></label><label>연장 사유<input id="ag-reason" required placeholder="학생에게 설명할 사유"></label></div><p id="ag-extend-error" class="ag-error" role="alert"></p>${button('변경 영향 미리보기','data-action="extend"')}</form><div id="ag-impact" hidden class="ag-notice"></div></details></section>`;
  }
  function results() {
    if(state.course!=='come2201-01') return heading('제출·결과','선택한 분반의 접수본만 표시합니다.')+'<section class="ag-panel">등록된 과제와 제출이 없습니다.</section>';
    return heading('제출·결과','옵저버 패턴 — 센서 알림 · 2026.09.18 15:22 KST 기준')+
      '<div class="ag-notice">최근 제출이 채점 대기이면 현재 점수는 미확정입니다. 이전 최고점으로 대신 표시하지 않습니다.</div>'+
      table(['학생','현재 제출','이전 최고점','이력'],[
        ['가상 학생 A<div class="ag-meta">DEMO-001</div>',`${badge('채점 대기','warn')}<div>점수 미확정</div><div class="ag-meta">09.18 15:22 · 3차</div>`,'100 / 100',button('이력·코드 확인','data-view="student"')],
        ['가상 학생 B<div class="ag-meta">DEMO-002</div>',`${badge('채점 대기','warn')}<div>점수 미확정</div><div class="ag-meta">09.18 15:21 · 첫 제출</div>`,'이전 평가 없음','첫 평가 대기'],
        ['그 외 제출 학생 16명', '채점 완료', '개별 이력에서 확인', '이 시안은 학생 A의 이력 제공']
      ])+'<p class="ag-meta">24명 중 18명 접수 · 미접수 6명 · 목록은 시안용 요약입니다.</p>';
  }
  function diff() {
    return state.comparison==='2-1'?`<span class="ag-removed">- // TODO: 센서 변경을 알림</span>\n<span class="ag-added">+ for (auto* observer : observers) {</span>\n<span class="ag-added">+     observer-&gt;update(value);</span>\n<span class="ag-added">+ }</span>`:`<span class="ag-removed">- observer-&gt;update(value);</span>\n<span class="ag-added">+ if (observer != nullptr) {</span>\n<span class="ag-added">+     observer-&gt;update(value);</span>\n<span class="ag-added">+ }</span>`;
  }
  function student() {
    return heading('가상 학생 A · 제출 이력','DEMO-001 · 옵저버 패턴 — 센서 알림 · 공개본 v1',button('목록으로','data-view="results"'))+
      `<div class="ag-stats">${stat('현재 제출','채점 대기','3차 · 09.18 15:22')}${stat('이전 공개 최고점','100 / 100','2차 · 09.18 15:16')}${stat('현재 점수 증감','미확정','채점 완료 후 비교')}</div>`+
      table(['접수 · KST','코드 버전','점수·증감','상태'],[
        ['09.18 15:22 · 3차','<code>demo-r03 · c9f1a20</code>','미확정 · —',badge('채점 대기','warn')],
        ['09.18 15:16 · 2차','<code>demo-r02 · b8e2d19</code>','100 / 100 · +40점',badge('공개','good')],
        ['09.18 15:03 · 1차','<code>demo-r01 · a7d3c08</code>','60 / 100 · 첫 평가',badge('공개','good')]
      ])+`<section class="ag-panel" style="margin-top:16px"><div class="ag-heading"><div><h3>코드 비교</h3><p class="ag-meta">같은 학생·과제 버전 · 읽기 전용 · 예시 발췌</p></div><label>비교할 제출<select id="ag-comparison"><option value="2-1" ${state.comparison==='2-1'?'selected':''}>1차 → 2차 · +40점</option><option value="3-2" ${state.comparison==='3-2'?'selected':''}>2차 → 3차 · 채점 대기</option></select></label></div><strong>main.cpp</strong><pre class="ag-code" id="ag-diff">${diff()}</pre></section>`;
  }
  function editor() {
    const titles=['문제','학생 파일','채점 자료','서버 검증','결과 확인','공개'];
    let panel='';
    if(state.step===1) panel=`<label>과제 제목<input id="ag-title" value="${esc(state.title)}" required aria-describedby="ag-title-error"></label><p id="ag-title-error" class="ag-error" role="alert"></p><div class="ag-fields"><label>언어<select id="ag-language">${['C++17','C11'].map(lang=>`<option ${state.language===lang?'selected':''}>${lang}</option>`).join('')}</select></label><label>마감 · KST<input id="ag-due" type="datetime-local" value="${esc(state.due)}" required aria-describedby="ag-due-error"></label></div><p id="ag-due-error" class="ag-error" role="alert"></p><div class="ag-notice">공개 전까지 초안입니다. 현재 웹 등록은 단일 main.c/main.cpp 표준 입출력 채점 대상입니다.</div>`;
    if(state.step===2) panel=`<h3>학생에게 배포할 파일</h3><p>README.md · ${state.language==='C11'?'main.c':'main.cpp'}</p><p class="ag-meta">정답·비공개 입력은 학생 파일에 포함하지 않습니다.</p>${button(state.uploaded?'예제 파일 등록됨':'예제 파일 등록 시연','data-action="upload"')}<p class="ag-meta">실제 파일을 업로드하지 않는 미리보기입니다.</p>`;
    if(state.step===3) panel='<h3>채점 자료</h3><dl><dt>정답·오답</dt><dd>검증용 예제 각 1개 · 교수자 전용</dd><dt>공개 테스트</dt><dd>기본 주문 · 40점</dd><dt>비공개 테스트</dt><dd>중첩 장식자 · 60점</dd><dt>총점</dt><dd>100점</dd></dl><p class="ag-meta">이 시안에서는 준비된 예제 자료를 사용합니다.</p>';
    if(state.step===4) panel='<h3>현재 자료 검증</h3><p>학생용 파일, 정답·오답, 배점을 함께 확인합니다.</p><p>대기 → 실행 중 → 성공/실패</p><div class="ag-notice">실제 서버가 보고한 상태만 표시하며 임의 진행률은 만들지 않습니다.</div>';
    if(state.step===5) panel=`<h3>예제 검증 성공</h3>${badge('검증 성공','good')}<dl><dt>정답 예제</dt><dd>기대 100점 / 실제 100점</dd><dt>오답 예제</dt><dd>기대 40점 / 실제 40점</dd><dt>학생 공개</dt><dd>아직 비공개</dd></dl><p>현재 자료를 공개 설정에서 한 번 더 확인하세요.</p>`;
    if(state.step===6) panel=`<h3>${state.published?'공개 완료 상태 예시':'학생 공개 전 확인'}</h3><dl><dt>대상 수업</dt><dd>${courses[state.course].name} · ${courses[state.course].section}분반</dd><dt>과제</dt><dd>${esc(state.title)}</dd><dt>자료·배점</dt><dd>예제 검증 성공 · 100점</dd><dt>제출 마감</dt><dd>${esc(state.due.replace('T',' '))} KST</dd><dt>결과 공개</dt><dd>채점 완료 후 공개</dd></dl><div class="ag-notice">${state.published?'시안에서만 공개 상태를 전환했습니다. 실제 학생에게 배포되지 않았습니다.':'공개본 자료는 직접 덮어쓰지 않습니다. 이후 수정은 별도 초안과 재검증이 필요합니다.'}</div>`;
    return heading('새 과제 준비',`6단계 중 ${state.step}단계 · ${state.published?'공개 완료 예시':'초안'}`)+`<ol class="ag-steps">${titles.map((t,i)=>`<li ${i+1===state.step?'aria-current="step"':''}>${i+1<state.step?'✓':i+1} ${t}</li>`).join('')}</ol><section class="ag-panel">${panel}<p id="ag-save-state" class="ag-meta">${state.dirty?'저장되지 않은 변경 있음':'예시 자료 · 실제 서버에는 저장하지 않습니다.'}</p><div class="ag-actions">${state.step>1&&!state.published?button('이전 단계','data-action="previous"'):''}${!state.published?button(state.step===4?'예제 검증 결과 보기':state.step===6?'공개 완료 상태 보기':'저장 후 다음 단계 · 시연','data-action="next"',true):button('과제 목록으로','data-view="assignments"',true)}</div></section>`;
  }
  function render() {
    const views={home,assignments,detail,results,student,editor};
    content.innerHTML=views[state.view]();
    picker.value=state.course;
    const current=['detail','editor'].includes(state.view)?'assignments':state.view==='student'?'results':state.view;
    root.querySelectorAll('.ag-nav [data-view]').forEach(b=>{if(b.dataset.view===current)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    const labels={home:'수업 개요',assignments:'과제',detail:'과제 상세',editor:'과제 준비',results:'제출·결과',student:'학생 이력'};
    root.querySelector('#ag-breadcrumb').textContent=`${courses[state.course].name} / ${courses[state.course].section}분반 / ${labels[state.view]}`;
  }
  function navigate(view) {
    if(state.dirty){notify('저장되지 않은 변경이 있습니다. 먼저 “저장 후 다음 단계”를 선택해 주세요.');return;}
    state.view=view;notify('');render();store();
  }
  root.addEventListener('input',event=>{
    if(event.target.id==='ag-search'){state.query=event.target.value;root.querySelector('#ag-task-list').innerHTML=taskTable();}
    if(['ag-title','ag-due'].includes(event.target.id)) {state[event.target.id==='ag-title'?'title':'due']=event.target.value;state.dirty=true;state.check=false;root.querySelector('#ag-save-state').textContent='저장되지 않은 변경 있음';}
  });
  root.addEventListener('change',event=>{
    if(event.target.id==='ag-language'){state.language=event.target.value;state.dirty=true;state.check=false;state.uploaded=false;root.querySelector('#ag-save-state').textContent='저장되지 않은 변경 있음';}
    if(event.target===picker){if(state.dirty){picker.value=state.course;notify('미저장 변경을 먼저 저장한 뒤 수업을 전환해 주세요.');return;}state.course=picker.value;state.assignment='observer';state.query='';state.filter='all';state.view='home';state.comparison='2-1';notify('수업 전환 완료 · 이전 과제·학생 선택 해제');render();store();}
    if(event.target.id==='ag-filter'){state.filter=event.target.value;root.querySelector('#ag-task-list').innerHTML=taskTable();}
    if(event.target.id==='ag-comparison'){state.comparison=event.target.value;root.querySelector('#ag-diff').innerHTML=diff();store();}
  });
  root.addEventListener('submit',event=>event.preventDefault());
  root.addEventListener('click',event=>{
    const b=event.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.view){navigate(b.dataset.view);return;}
    if(b.dataset.task){state.assignment=b.dataset.task;navigate('detail');return;}
    const action=b.dataset.action;
    if(action==='new'||action==='copy'){state.step=1;state.published=false;state.check=false;state.uploaded=false;state.title=action==='copy'?`${selectedTask().title} · 새 버전`:'데코레이터 패턴 — 주문 금액 계산';navigate('editor');}
    if(action==='upload'){state.uploaded=true;render();notify('예제 학생용 파일 등록 상태를 표시합니다.');}
    if(action==='previous'){state.step--;render();}
    if(action==='next'){
      if(state.step===1){
        const titleError=!state.title.trim();
        const dueError=!/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(state.due)||state.due<='2026-09-18T15:22';
        root.querySelector('#ag-title-error').textContent=titleError?'과제 제목을 입력하세요. 기존 입력은 유지됩니다.':'';
        root.querySelector('#ag-due-error').textContent=dueError?'예시 기준 시각 2026.09.18 15:22 KST 이후로 설정하세요.':'';
        if(titleError||dueError){root.querySelector(titleError?'#ag-title':'#ag-due').focus();return;}
      }
      if(state.step===2&&!state.uploaded){notify('학생용 예제 파일을 먼저 등록해 주세요.');return;}
      state.dirty=false;if(state.step===4)state.check=true;
      if(state.step===6){state.published=true;notify('공개 완료 상태 시연 · 서버 전송 없음');}else{state.step++;notify('');}
      render();store();
    }
    if(action==='extend'){
      const due=root.querySelector('#ag-new-due').value, reason=root.querySelector('#ag-reason').value.trim();
      const original=selectedTask().id==='hello'?'2026-09-11T18:00':'2026-09-20T18:00';
      const error=root.querySelector('#ag-extend-error');
      if(!due||due<=original||due<='2026-09-18T15:22'||!reason){error.textContent='현재 마감과 예시 기준 시각보다 늦은 시간, 연장 사유를 입력하세요. 입력은 유지됩니다.';root.querySelector(!due||due<=original||due<='2026-09-18T15:22'?'#ag-new-due':'#ag-reason').focus();return;}
      error.textContent='';const impact=root.querySelector('#ag-impact');impact.hidden=false;impact.textContent=`${courses[state.course].section}분반 · ${selectedTask().title}: ${original.replace('T',' ')} → ${due.replace('T',' ')} KST. 사유: ${reason}. 기존 제출·점수 보존. 설계 미리보기이며 실제 변경하지 않습니다.`;
    }
  });
  function applyDesign(){root.style.setProperty('--ag-space',design.compact?'14px':'20px');root.dataset.cards=String(design.cards);}
  function restore(saved){const p=saved?.privateContent;if(p){design.cards=p.cards===true;design.compact=p.compact===true;applyDesign();}const m=saved?.modelContent;if(!state.dirty && m && courses[m.course] && ['home','assignments','results','student'].includes(m.screen)){state.course=m.course;state.view=m.course==='come2201-01'?m.screen:'home';render();}}
  render();restore(window.openai?.widgetState);applyDesign();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{applyDesign();store();}});tweak.addToggle(design,'compact',{label:'촘촘한 본문 간격'});tweak.addToggle(design,'cards',{label:'데스크톱에서도 카드 목록'});}
})();
</script>
